services:
  migrate:
    image: caelun-ai-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

  yingce-agent:
    image: caelun-ai-yingce-agent:server
    build:
      context: .
      dockerfile: yingce-agent/Dockerfile

  backend:
    image: caelun-ai-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

  web:
    image: caelun-ai-web:server
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
