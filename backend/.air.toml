root = "."
tmp_dir = "/tmp/caelun-ai-air"

[build]
bin = "/tmp/caelun-ai-air/server"
cmd = "go build -o /tmp/caelun-ai-air/server ./cmd/server"
delay = 800
exclude_dir = ["data", "tmp", "vendor"]
exclude_regex = ["_test\\.go"]
include_ext = ["go", "mod", "sum"]
kill_delay = "500ms"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
